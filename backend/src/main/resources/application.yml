micronaut:
  application:
    name: botView

  server:
    port: 8080
    netty:
      parent:
        loom-carrier: true
      thread-selection: blocking

  router:
    static-resources:
      default:
        enabled: true
        mapping: /**
        paths: classpath:public

  security:
    authentication: cookie
    redirect:
      login-success: /
      login-failure: /
    cookie:
      cookie-secure: false
      cookie-same-site: Lax

    intercept-url-map:
      - pattern: /**
        access: [ isAnonymous() ]

github:
  token: ${GITHUB_TOKEN:}
gitlab:
  token: ${GITLAB_TOKEN:}
bitbucket:
  token: ${BITBUCKET_TOKEN:}

ngrok:
  enabled: true

llm:
  model-url: https://huggingface.co/bartowski/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf
  model-path: ${LLM_MODEL_PATH:./models/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf}


datasources:
  default:
    url: jdbc:duckdb:${db.path:./data/botview.duckdb}
    driver-class-name: org.duckdb.DuckDBDriver
    dialect: ANSI
    schema-generate: NONE
